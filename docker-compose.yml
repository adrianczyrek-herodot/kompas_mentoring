# Local PostgreSQL 17 (spec §3). btree_gist, unaccent and pg_trgm ship with the official image
# (contrib) and are created by the first migration: `docker compose up -d && pnpm db:migrate`.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: kompas
      POSTGRES_PASSWORD: kompas
      POSTGRES_DB: kompas
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kompas -d kompas']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
